name: Wellness Tourism MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/tourism.csv"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-data:
    name: Register and validate dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit test for data registration
        run: python -m unittest discover -s tests -v
      - name: Register raw dataset
        run: python src/data_registration.py --input data/tourism.csv
      - name: Upload registered dataset and validation report
        uses: actions/upload-artifact@v4
        with:
          name: registered-dataset
          path: |
            data/tourism.csv
            reports/data_registration_summary.json
          if-no-files-found: error

  prepare-data:
    name: Clean data and create train-test artifact
    needs: register-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-dataset
          path: .
      - name: Prepare train and test splits
        run: python src/data_preparation.py --input data/tourism.csv --output-dir data/processed
      - name: Upload train-test splits for the model job
        uses: actions/upload-artifact@v4
        with:
          name: train-test-splits
          path: data/processed
          if-no-files-found: error

  train-model:
    name: Tune, track and register model
    needs: prepare-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download train-test split artifact
        uses: actions/download-artifact@v4
        with:
          name: train-test-splits
          path: data/processed
      - name: Tune model and log experiments
        run: python src/train_model.py --data-dir data/processed
      - name: Enforce model quality gate
        run: python src/verify_quality.py --metrics reports/model_metrics.json
      - name: Upload model and experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-and-reports
          path: |
            models/wellness_package_model.joblib
            reports/
            experiments/
          if-no-files-found: error
      - name: Commit approved model and reports to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ reports/ experiments/
          git diff --cached --quiet || git commit -m "chore: register refreshed wellness model [skip ci]"
          git push
